[project]
name = "financial-ai-academy"
version = "0.1.0"
description = "Contract-driven Financial AI Academy backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "markdown-it-py==4.2.0",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "postgres: requires a supported real PostgreSQL server",
]
