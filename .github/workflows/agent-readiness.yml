name: Agent readiness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Deterministic agent readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check pull-request readiness and lifecycle transitions
        if: github.event_name == 'pull_request'
        run: python dev-tools/agent/check_ready.py --profile ci --base-ref "${{ github.event.pull_request.base.sha }}" --report-path artifacts/control-plane/agent-readiness.json

      - name: Check main-branch readiness
        if: github.event_name == 'push'
        run: python dev-tools/agent/check_ready.py --profile ci --report-path artifacts/control-plane/agent-readiness.json

      - name: Retain privacy-minimized readiness report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-readiness-report
          path: artifacts/control-plane/agent-readiness.json
          if-no-files-found: error
          retention-days: 14
